name: 🎬 Post Ad (Poster + Video)

# ── Triggers ───────────────────────────────────────────────────────────────────
on:
  # 8:00 AM IST = 02:30 UTC, 8:00 PM IST = 14:30 UTC (daily)
  schedule:
    - cron: "30 2 * * *"
    - cron: "30 14 * * *"

  # Manual trigger from Actions tab
  workflow_dispatch:

# Need write permission so the job can commit the updated rotation state
permissions:
  contents: write

# Prevent two runs from clobbering the state file at the same time
concurrency:
  group: post-ad
  cancel-in-progress: false

jobs:
  post:
    name: Post next poster + video
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4
        with:
          # Required so the post-step push works
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔐 Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCLOUD_SERVICE_ACCOUNT_KEY }}

      - name: ☁️ Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📥 Install Python deps
        run: pip install -r requirements.txt

      - name: 🚀 Post next poster + video
        env:
          FB_PAGE_ID:       ${{ secrets.FB_PAGE_ID }}
          FB_ACCESS_TOKEN:  ${{ secrets.FB_ACCESS_TOKEN }}
          IG_USER_ID:       ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN:  ${{ secrets.IG_ACCESS_TOKEN }}
          GCS_BUCKET_NAME:  ${{ secrets.GCS_BUCKET_NAME }}
        run: python run_pipeline.py

      - name: 💾 Commit updated rotation state
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- state/last_index.json; then
            git add state/last_index.json
            git commit -m "chore(state): advance rotation index [skip ci]"
            git push
          else
            echo "No state change to commit."
          fi
